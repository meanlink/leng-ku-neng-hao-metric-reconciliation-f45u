name: coldstore-energy-reconcile
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-coldstore-energy-reconcile}-db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coldstore}
      MYSQL_USER: ${MYSQL_USER:-coldstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coldstore_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pw}
    ports:
      - "${DB_PORT:-17749}:3306"
    volumes:
      - coldstore_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-coldstore-energy-reconcile}-redis
    command: redis-server --appendonly yes
    volumes:
      - coldstore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-coldstore-energy-reconcile}-backend
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coldstore}
      MYSQL_USER: ${MYSQL_USER:-coldstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coldstore_pw}
      JWT_SECRET: ${JWT_SECRET:-coldstore-demo-secret}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${BACKEND_PORT:-19249}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - coldstore_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-coldstore-energy-reconcile}-worker
    command: ["python", "-m", "scripts.worker_heartbeat"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coldstore}
      MYSQL_USER: ${MYSQL_USER:-coldstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coldstore_pw}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - coldstore_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/artifacts/worker-heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-coldstore-energy-reconcile}-frontend
    ports:
      - "${FRONTEND_PORT:-18249}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  coldstore_db_data:
    name: ${COLDSTORE_DB_VOLUME:-coldstore-energy-reconcile-db-data}
  coldstore_redis_data:
    name: ${COLDSTORE_REDIS_VOLUME:-coldstore-energy-reconcile-redis-data}
  coldstore_artifacts:
    name: ${COLDSTORE_ARTIFACT_VOLUME:-coldstore-energy-reconcile-artifacts}
